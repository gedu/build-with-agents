# verify — the only layer of this repo a new collaborator needs nothing for.
#
# Every other guarantee here is local and opt-in. Git hooks live in .git/, which is never
# cloned, and git deliberately runs nothing on clone, so a collaborator who has not run
# `./setup.sh --hooks` has no redaction gate and nothing tells them. This workflow is the
# server-side half. See decisions/0014-a-public-guarantee-cannot-be-opt-in.md, including
# its honest limit: `on: push` runs AFTER the content is published, so it detects rather
# than prevents. Prevention on a shared branch is a branch protection rule, which is
# repository configuration and not a committed file.
#
# THE RULE EVERY JOB BELOW FOLLOWS
# A job that cannot run its check must FAIL. `could not run` is not `passed`
# (theory/loops/verifier-availability.md). Each executable here exits 2 for that state and
# a non-zero exit fails the job, so the distinction survives into the CI result. Nothing
# below is allowed to `|| true`, `continue-on-error`, or skip its way to green.
#
# WHY EACH JOB RUNS A SELF-TEST BEFORE THE CHECK
# ADR 0013 — a committed executable carries its own test. The self-test and the check it
# guards are steps of ONE job, in that order, on purpose: split across two jobs, the check
# could report "clean" in a green job while its own self-test failed in a red one.

name: verify

on:
  push:
  pull_request:

# Read-only is enough: nothing here comments, labels, pushes or publishes.
permissions:
  contents: read

jobs:
  redaction:
    name: redaction gate
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag: a tag is mutable and this is the step that fetches
      # the code every other step trusts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--all` reads the working tree, not history. One commit is all it needs.
          fetch-depth: 1
      - name: Prove the gate works before trusting it
        run: ./hooks/pre-commit --self-test
      - name: Scan every tracked file
        run: ./hooks/pre-commit --all

  commit-messages:
    name: commit message gate
    runs-on: ubuntu-latest
    # A branch or tag deletion carries no content and its ref is already gone. Every other
    # event must produce a real result.
    if: github.event.deleted != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range scan reads commit messages, so it needs the commits. A shallow clone
          # would leave the range endpoints absent and send this job down its full-history
          # fallback on every run.
          fetch-depth: 0
      - name: Prove the gate works before trusting it
        run: ./hooks/commit-msg --self-test
      - name: Scan the commit messages in this event's range
        # Event fields are passed through the environment rather than interpolated into
        # the script, so no value from the event is ever parsed as shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          case "$EVENT_NAME" in
            push)
              TO="$PUSH_AFTER"
              FROM="$PUSH_BEFORE"
              # `before` is all zeros on a new branch, a new tag, and after some
              # force-pushes. The range is then invalid, and `git rev-list <zeros>..<head>`
              # would not quietly scan nothing — it would error — but neither outcome is
              # allowed to become a pass. Fall back to the full reachable history and say
              # so in the log.
              case "$FROM" in
                '')
                  echo "::notice::this push event carried no 'before' revision; scanning every commit reachable from $TO instead"
                  FROM='-'
                  ;;
                *[!0]*)
                  : # contains a non-zero character, so it is a real revision
                  ;;
                *)
                  echo "::notice::'before' is all zeros (new branch, new tag, or force-push); scanning every commit reachable from $TO instead"
                  FROM='-'
                  ;;
              esac
              ;;
            pull_request)
              FROM="$PR_BASE"
              TO="$PR_HEAD"
              if [ -z "$FROM" ] || [ -z "$TO" ]; then
                echo "::error::this pull_request event carried no base or head revision; refusing to report a pass for a range that could not be computed"
                exit 2
              fi
              ;;
            *)
              echo "::error::unsupported event '$EVENT_NAME'; refusing to report a pass for a range that could not be computed"
              exit 2
              ;;
          esac

          # A force-push can also leave `before` pointing at a commit that is no longer
          # reachable and therefore not in this checkout. Same fallback, same loud note.
          if [ "$FROM" != '-' ] && ! git cat-file -e "${FROM}^{commit}" 2>/dev/null; then
            echo "::notice::'$FROM' is not present in this checkout; scanning every commit reachable from $TO instead"
            FROM='-'
          fi

          echo "range: ${FROM}..${TO}"
          ./hooks/commit-msg --range "$FROM" "$TO"

  structure:
    name: structural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Frontmatter and the skills/ASK.md rule are properties of the tree, not of
          # history.
          fetch-depth: 1
      - name: Prove the checker works before trusting it
        run: ./check.sh --self-test
      - name: Check the structural invariants
        run: ./check.sh

  # Two committed executables post-date the draft of this workflow: ./setup.sh grew its --self-test and
  # ./open-work.sh did not exist. ADR 0014's non-negotiable list says every committed executable carries
  # its own test and that CI runs it, so these two were already covered by the decision — they were only
  # missing from the file. One job, because neither is a gate and neither may become one here.
  #
  # WHY ./open-work.sh IS RUN AND NOT ONLY SELF-TESTED
  # It is not a gate and open work is not a violation, so its exit 0 proves nothing about this
  # repository's content — running it must never be able to fail a push for holding open work. Its exit 2
  # means 'could not run', which is exactly the state ADR 0014 forbids reporting as a pass. So the step
  # asserts exit 0 specifically and treats any other code as the failure it is: `set -e` alone would
  # already fail on 2, and it is kept that way on purpose.
  #
  # WHY THIS JOB IS THE FRESH-CLONE PROOF
  # `setup.sh --self-test` asserts the installer's safety contract (a pre-existing real file kept, a
  # foreign symlink kept, no unanchored .gitignore entry surviving, byte-identical re-runs, a dry run
  # that writes nothing). ./setup.sh and ./open-work.sh are POSIX-ish tools with no install step, so a
  # runner that has installed nothing is the most honest environment they can be tested in.
  #
  # WHY THE TARGETS ARE DISCOVERED NOW, AND WHAT THAT CHANGED
  # This job used to name `./setup.sh --self-test` and `./open-work.sh --self-test` in prose, which is
  # the exact defect `rig-self-tests` below was written to close one directory over: a committed
  # executable that post-dates the file is covered by nothing, and no self-test of any gate can report
  # it. `./obligation-ledger.sh` post-dated it the same way on 2026-10-16 and would have needed an edit
  # here to be tested at all. So the candidates now come from the index — mode `100755`, everything
  # outside `rig/` (which the next job owns, on a python3 warrant this job must not take on).
  #
  # WHY THE THREE GATE EXECUTABLES ARE RUN HERE TOO, THOUGH THEY HAVE THEIR OWN JOBS
  # `./check.sh`, `./hooks/pre-commit` and `./hooks/commit-msg` are discovered and tested here *and* in
  # the jobs that pair a self-test with the check it guards. That duplication is deliberate and costs
  # about two seconds: this job's claim is "no committed executable outside rig/ is untested", and an
  # exclusion list naming those three would make the claim false the day somebody deletes their job.
  # ADR 0014's pairing rule is satisfied by their own jobs and is not weakened by a second reading.
  executables:
    name: committed executables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every self-test below is a property of the tree. The ledger step reads history for its C3
          # class and says what that costs, in its own comment.
          fetch-depth: 1
      - name: Run every committed executable's own test, discovered from the index
        run: |
          set -eu

          executables=()
          while IFS= read -r p; do
            executables+=("$p")
          done < <(git ls-files -s ':(exclude)rig/' | awk '$1 == "100755" { print $4 }')

          if [ "${#executables[@]}" -eq 0 ]; then
            echo "::error::discovered no committed executable outside rig/ in the index; refusing to report a pass for having tested nothing"
            exit 2
          fi

          failed=0
          ran=0
          untested=()

          probe() {
            # $1 = label, rest = the command. Records the verdict and never aborts the loop, so one
            # red test cannot hide the result of the test after it.
            local label="$1"; shift
            local rc=0
            "$@" || rc=$?
            ran=$((ran + 1))
            if [ "$rc" -eq 0 ]; then
              echo "ok: $label"
            else
              echo "::error::$label exited $rc -- non-zero fails, and exit 2 means could-not-run, never passed"
              failed=1
            fi
          }

          # Detection is a mention of the flag, deliberately generous: a file that claims the flag and
          # does not implement it exits 2 and turns this job red, so detection fails CLOSED toward a
          # failing job rather than open toward silence. A file with no mention at all is named below as
          # untested instead of skipped quietly, because `absent` is not `covered`.
          for p in "${executables[@]}"; do
            if grep -q -- '--self-test' "$p"; then
              probe "./$p --self-test" "./$p" --self-test
            else
              untested+=("$p (committed executable, mode 100755)")
            fi
          done

          for u in ${untested[@]+"${untested[@]}"}; do
            echo "::warning::$u carries no --self-test, so ADR 0013 is unmet for it. Named rather than counted as covered."
          done

          if [ "$ran" -eq 0 ]; then
            echo "::error::${#executables[@]} executable(s) were discovered and none carries a --self-test; this job ran nothing"
            exit 2
          fi

          echo "ran $ran self-test(s) across ${#executables[@]} discovered executable(s); ${#untested[@]} named as carrying none"
          exit "$failed"
      - name: Run the index, and accept nothing but exit 0
        run: ./open-work.sh
      # WHY THE LEDGER IS RUN AND NOT ONLY SELF-TESTED
      # Its exit 0 means only "the report was produced"; findings live in the text and never change the
      # exit code, so this step can never fail a push for what the repository contains. What it does
      # prove is the thing the self-test cannot: the self-test builds throwaway repositories and never
      # reads this one (deliberately, or its assertions would rot the moment anything was committed),
      # so a live scan of this corpus is exercised nowhere else. Exit 2 means the `--list-content` seam
      # is missing or refusing in a fresh clone, and ADR 0014 forbids reporting could-not-run as a pass.
      #
      # WHY THE WALL CLOCK IS BOUNDED
      # This file's own history records a class here that hung forever (C4's `match()` clobbering
      # RSTART). A bound converts that into a named could-not-run in seconds instead of a runner timeout
      # hours later. 300 s is ~21x the 13.8 s this scan measured at f1794f8 over 119 content files; the
      # purpose is the hang, not the average, so the margin is not tuned to the mean.
      #
      # WHAT THE SHALLOW CLONE COSTS THIS STEP, STATED RATHER THAN HIDDEN
      # Only the exit code is asserted. C3 asks whether a quoted hash resolves from any ref, and at
      # `fetch-depth: 1` the reachable set is one commit deep, so C3 reports more objects here than a
      # full clone would. It condemns nothing in any case, and the log is printed so a reader can see
      # the denominator rather than infer it.
      - name: Run the obligation ledger, and accept nothing but exit 0
        run: |
          set -eu
          rc=0
          timeout 300 ./obligation-ledger.sh > "$RUNNER_TEMP/ledger.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/ledger.log"
          if [ "$rc" -ne 0 ]; then
            case "$rc" in
              124) echo "::error::the obligation ledger hit its 300 s bound and produced no report: could not run, not clean" ;;
              2)   echo "::error::the obligation ledger exited 2 (could not run) — its --list-content seam is missing or refusing in this checkout" ;;
              *)   echo "::error::the obligation ledger exited $rc; its contract is 0 (report produced) or 2 (could not run), so any other code is a defect" ;;
            esac
            exit 1
          fi
          echo "ok: the ledger produced a report over this checkout (findings above are the product, not failures)"

  # ADR 0014's non-negotiable list says every committed executable carries its own test and CI runs it.
  # The job above applies that to `./setup.sh` and `./open-work.sh`, which post-dated the draft. Two rig
  # executables post-dated it the same way and were never picked up: `rig/check.sh` and
  # `rig/run-pipeline.sh`. This job is the decision applied, not a new idea — and it does not repeat the
  # archived SUGGESTION-1, whose disposition refuses to re-register the `check.sh` bash-arm gap. This
  # rests on the ADR, and supplies the thing that disposition lacked: a named trigger, which is the push.
  #
  # WHY THE LIST IS DISCOVERED AND NOT WRITTEN DOWN
  # The defect being fixed here is a hardcoded list that went stale while the repo grew around it, which
  # no self-test of the gate can ever report (ADR 0014's own rule rotted that way once already). So the
  # candidates come from the index: mode 100755 is git's own record of a committed executable, and a new
  # rig executable is covered the day it is committed. Zero candidates exits 2 — a scan that examined
  # nothing is `could not run`, never a pass (`gaps/0002`'s counterexample, a file list gathered with
  # `|| true`).
  #
  # WHY THE .py MODULES ARE SEPARATE, AND WHY THEY ARE STILL HERE
  # `rig/derive.py`, `rig/report.py` and `rig/collect.py` are mode 100644, so ADR 0014's word
  # "executable" does not reach them — measured, not assumed. Their warrant is ADR 0013 plus a fact: in
  # CI their `--self-test` runs nowhere at all, because the only thing that composes them is
  # `check_component_self_test()` inside `rig/check.sh`'s REAL gate, and that gate cannot run here (see
  # the next heading). Adding a bash arm to that function would not fix this job either: `rig/check.sh`
  # dispatches `--self-test) self_test; exit $?`, so the composition lines sit below the exit and are
  # unreachable from the flag. Verified by logging every `python3` invocation during
  # `rig/check.sh --self-test`: five synthetic-fixture heredocs, zero `--self-test` calls.
  #
  # WHY THE REAL GATE IS NOT RUN HERE — THE ONE THING NOT TO "IMPROVE"
  # CI checks out a tree with no gitignored `rig/runs/`. There, `rig/check.sh` fails 5/18 AND truncates
  # both committed `rig/results/*/runs.jsonl` to zero bytes, reproducing the wipe in a clean checkout and
  # then reporting green against it. Only `--self-test` dispatches are hermetic: all five run in a clean
  # clone in 1.74 s, leave both goldens at their committed line counts, and leave `git status` empty.
  # Keep it that way.
  #
  # WHY NO GOLDEN LINE COUNT IS STATED HERE ANY MORE
  # This comment used to assert the goldens stay "at 3 and 42 lines". The 3 moved to 13 on 2026-10-17
  # when the first countable campaign landed, and nothing in this repository generates that pair — so it
  # was a hand-carried figure rotting inside a file whose whole subject is honest measurement. What the
  # job actually claims is that the dispatches leave the goldens *unchanged*, which is what stays.
  # Re-measured 2026-10-17 in an isolated `git archive` copy with no `rig/runs/` and the 13-row golden in
  # place: the real gate still fails exactly 5/18 and still truncates both goldens to zero bytes, and the
  # five dispatches still exit clean with `git status` empty and both goldens byte-identical.
  # `1.74 s` is deliberately NOT restated as current: it is ubuntu-latest's clean clone, and replaying the
  # same job logic locally took 3.39 s including discovery — a different population, so it neither
  # confirms nor refutes 1.74. The five dispatches read synthetic heredoc fixtures and never the goldens
  # (measured: goldens byte-identical after all five run), so their runtime does not track a golden's
  # row count.
  #
  # WHY A JOB OF ITS OWN AND NOT MORE STEPS IN THE JOB ABOVE
  # ADR 0014 rejects running unrelated checks in one job in sequence: a failing early step skips the rest,
  # so the log reports less than was checked. Separately, `python3` is a rig-only prerequisite
  # (`decisions/0011`), and both rig self-tests exit 2 naming it when it is absent — measured with a PATH
  # lacking `python3` — so a missing interpreter lands on the rig's result and nowhere else.
  rig-self-tests:
    name: rig self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git ls-files` reads the index, not history, so one commit is enough — verified in a
          # `--depth 1` clone, where the discovery below returns the same three executables.
          fetch-depth: 1
      - name: Run every rig executable's and module's own test
        run: |
          set -eu

          executables=()
          modules=()
          while IFS= read -r p; do
            executables+=("$p")
          done < <(git ls-files -s 'rig/*' ':(exclude)rig/fixtures/' | awk '$1 == "100755" { print $4 }')
          while IFS= read -r p; do
            modules+=("$p")
          done < <(git ls-files 'rig/*.py' ':(exclude)rig/fixtures/')

          if [ "${#executables[@]}" -eq 0 ] && [ "${#modules[@]}" -eq 0 ]; then
            echo "::error::discovered no rig executable or module in the index; refusing to report a pass for having tested nothing"
            exit 2
          fi

          failed=0
          ran=0
          untested=()

          probe() {
            # $1 = label, rest = the command. Records the verdict and never aborts the loop, so one
            # red test cannot hide the result of the test after it.
            local label="$1"; shift
            local rc=0
            "$@" || rc=$?
            ran=$((ran + 1))
            if [ "$rc" -eq 0 ]; then
              echo "ok: $label"
            else
              echo "::error::$label exited $rc -- non-zero fails, and exit 2 means could-not-run, never passed"
              failed=1
            fi
          }

          # Detection is a mention of the flag, which is deliberately generous: a file that claims the
          # flag but does not implement it exits 2 and turns this job red, so detection fails CLOSED
          # toward a failing job rather than open toward silence. A file with no mention at all is named
          # below as untested instead of being skipped quietly, because `absent` is not `covered`.
          if [ "${#executables[@]}" -gt 0 ]; then
            for p in "${executables[@]}"; do
              if grep -q -- '--self-test' "$p"; then
                probe "./$p --self-test" "./$p" --self-test
              else
                untested+=("$p (committed executable, mode 100755)")
              fi
            done
          fi

          if [ "${#modules[@]}" -gt 0 ]; then
            for p in "${modules[@]}"; do
              if grep -q -- '--self-test' "$p"; then
                probe "python3 $p --self-test" python3 "$p" --self-test
              else
                untested+=("$p (module, mode 100644)")
              fi
            done
          fi

          for u in ${untested[@]+"${untested[@]}"}; do
            echo "::warning::$u carries no --self-test, so ADR 0013 is unmet for it. Named rather than counted as covered."
          done

          if [ "$ran" -eq 0 ]; then
            echo "::error::$((${#executables[@]} + ${#modules[@]})) rig path(s) were discovered and none carries a --self-test; this job ran nothing"
            exit 2
          fi

          echo "ran $ran rig self-test(s); ${#untested[@]} path(s) named as carrying none"
          exit "$failed"
